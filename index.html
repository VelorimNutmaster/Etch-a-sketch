<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class = "body">
    <h2>Etch a sketch</h2>
    <p>Click and drag to draw on the canvas.</p>
               

    <input type="number" id="gridSize" placeholder="Enter grid size" min="16" max="100">
    <button id="applyGridSize">Apply</button>
    <button id="reset">Reset</button>
    <button id = "singleColor">Single Color</button>
    <button id = "randomColor">Random Color</button>
    </div>
    
    <div id = "canvas"></div>
</body>
</html>
